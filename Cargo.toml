[package]
name = "polars-tokenizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Count-only token analytics expressions for Polars"

[lib]
name = "polars_tokenizer"
crate-type = ["cdylib", "rlib"]

[features]
default = []
gemma3-prototype = ["dep:aho-corasick", "dep:rustc-hash", "dep:sentencepiece-model"]

[dependencies]
aho-corasick = { version = "=1.1.5", optional = true }
polars = { version = "=0.52.0", default-features = false }
polars-core = { version = "=0.52.0", default-features = false, features = ["dtype-categorical"] }
pyo3-polars = { version = "=0.25.0", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
rustc-hash = { version = "=2.1.3", optional = true }
sentencepiece-model = { version = "=0.1.4", optional = true }
tiktoken = { version = "=4.1.2", default-features = false, features = ["vocab-cl100k_base", "vocab-o200k_base"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1.0"
sha2 = "0.10"

[[bench]]
name = "exact_count"
harness = false

[[bench]]
name = "cache_crossover"
harness = false

[[bench]]
name = "cache_polars"
harness = false

[[bench]]
name = "component_overhead"
harness = false

[[bench]]
name = "gemma3_count"
harness = false
required-features = ["gemma3-prototype"]

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
codegen-units = 1
lto = "thin"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
