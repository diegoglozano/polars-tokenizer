[package]
name = "polars-tokenizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "Count-only token analytics expressions for Polars"

[lib]
name = "polars_tokenizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
polars = { version = "=0.52.0", default-features = false }
polars-core = { version = "=0.52.0", default-features = false, features = ["dtype-categorical"] }
pyo3-polars = { version = "=0.25.0", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
tiktoken = { version = "=4.1.2", default-features = false, features = ["vocab-o200k_base"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "exact_count"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.bench]
codegen-units = 1
lto = "thin"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
